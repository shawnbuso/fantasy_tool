# Superflex, with positions balanced so the average QB, RB, WR and TE are worth the
# same per game. Solved by `fantasy-tool balance`; see the README for the method.
#
# Only increases: nothing below is lower than Yahoo's default. Quarterbacks score the
# most and can't be reduced, so they set the target the other three climb to.
#
# The tight end premium is a custom rule here because Yahoo could not do it when this
# was solved: its categories applied to every player alike, and tight ends are
# out-produced by receivers on every per-game receiving stat, so raising a shared
# category helps receivers more and widens the gap rather than closing it. Yahoo added
# per-position category values for 2026 -- see the `positions` block in
# balanced_qwr.yaml -- and the adopted rules use that. These three are kept as the
# original solve, and as the worked example of a custom rule.

extends: superflex.yaml
name: "Balanced superflex -- 0.5 PPR"

yards_per_point:
  receiving_yards: 5.838   # was 10
  rushing_yards: 7.491     # was 10

scoring:
  receptions: 0.5

custom_rules:
  modules: [house_2026.py]
  enabled:
    position_premium:
      TE_receiving_yards: 0.1132
