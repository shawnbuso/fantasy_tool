# Superflex without tight ends in the flex.
#
# One dedicated slot at each offensive position, plus four slots that QB, RB or WR
# can fill. Tight end keeps its own slot and competes with nobody.
#
# The reason: tight ends score less than the other three and Yahoo has no way to fix
# that, since its categories apply to every player alike. But a position that scores
# less only costs you something when it has to win a slot against the others. Give it
# a dedicated slot and every team starts exactly one, so the shortfall is symmetric
# and nobody is disadvantaged -- the same way a kicker scoring less than a running
# back bothers no one.
#
# That leaves QB, RB and WR sharing the flex, and those three *can* be balanced with
# Yahoo's own settings and no custom rules.

extends: base_yahoo.yaml
name: "Superflex (QB/RB/WR flex) -- scoring unchanged"

lineup:
  starters: [QB, RB, WR, TE, "Q/W/R", "Q/W/R", "Q/W/R", "Q/W/R", K, DEF]
  bench: 6
