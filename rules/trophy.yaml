# Participation trophy on top of the recommended balanced setup.
#
# One number for every position: a starter who took an offensive snap and scored
# nothing gets this instead of a zero. Same points regardless of position, which is
# the easiest version to explain and happens to be kindest to tight ends -- they
# trigger it most often and score least.
#
# A fixed number rather than that week's live average: far less bookkeeping, knowable
# in advance, and it doesn't make your bonus depend on how your opponent's players did.

extends: balanced_qwr.yaml
name: "Balanced superflex + participation trophy"

custom_rules:
  modules: [house_2026.py]
  enabled:
    participation_trophy:
      value: 12
