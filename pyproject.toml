[project]
name = "fantasy-tool"
version = "0.1.0"
description = "Test candidate fantasy football rules against historical NFL data"
readme = "README.md"
authors = [
    { name = "Shawn Busolits", email = "shawn.busolits@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "pydantic>=2.9",
    "pyyaml>=6",
    "typer>=0.15",
]

[project.optional-dependencies]
scrape = [
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "playwright>=1.49",
]

[project.scripts]
fantasy-tool = "fantasy_tool.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
